<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anastasia Shabanova, Russian–English translator</title>
<meta name="description" content="Russian–English document translation, interpreting and editing by Anastasia Shabanova.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#EDF1F8; --text:#15192E; --muted:#5A6180; --line:rgba(21,25,46,.10);
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.78); --edge:rgba(255,255,255,.9);
  --cobalt:#2446B8; --cobalt-soft:rgba(36,70,184,.09); --on-cobalt:#fff;
  --b1:rgba(62,98,220,.30); --b2:rgba(120,160,255,.28); --b3:rgba(36,70,184,.18);
  --shadow:0 18px 40px -24px rgba(21,35,90,.35);
  --font:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1430; --text:#EDF0FA; --muted:#A3AACB; --line:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.10); --edge:rgba(255,255,255,.14);
    --cobalt:#8FA8FF; --cobalt-soft:rgba(143,168,255,.12); --on-cobalt:#0E1430;
    --b1:rgba(50,84,210,.45); --b2:rgba(90,70,200,.30); --b3:rgba(30,110,200,.30);
    --shadow:0 20px 50px -24px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1430; --text:#EDF0FA; --muted:#A3AACB; --line:rgba(255,255,255,.10);
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.10); --edge:rgba(255,255,255,.14);
  --cobalt:#8FA8FF; --cobalt-soft:rgba(143,168,255,.12); --on-cobalt:#0E1430;
  --b1:rgba(50,84,210,.45); --b2:rgba(90,70,200,.30); --b3:rgba(30,110,200,.30);
  --shadow:0 20px 50px -24px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px;border-radius:6px}

.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 40s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:48vw;height:48vw;left:-14vw;top:-14vw;background:var(--b1)}
.bgfx i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:30vh;background:var(--b2);animation-delay:-12s}
.bgfx i:nth-child(3){width:40vw;height:40vw;left:30vw;bottom:-22vw;background:var(--b3);animation-delay:-24s}
@keyframes drift{to{transform:translate(5vw,6vh) scale(1.08)}}

.glass{position:relative;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--shadow)}
.wrap{position:relative;z-index:1;width:min(1120px,100% - 40px);margin-inline:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;padding:14px 0}
.bar{display:flex;align-items:center;gap:16px;padding:8px 8px 8px 18px;border-radius:16px}
.brand{text-decoration:none;font-weight:700;font-size:16px;white-space:nowrap;margin-right:auto}
.links{display:flex;gap:2px}
.links a{text-decoration:none;padding:8px 12px;border-radius:10px;font-size:15px;font-weight:500;color:var(--muted);transition:color .2s,background .2s}
.links a:hover{color:var(--text);background:var(--cobalt-soft)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;background:none;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--cobalt);color:var(--on-cobalt)}
.menu{display:none;border:1px solid var(--line);background:none;width:40px;height:40px;border-radius:10px;cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;text-decoration:none;font-weight:600;font-size:16px;padding:13px 22px;border-radius:12px;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn-main{background:var(--cobalt);color:var(--on-cobalt)}
.btn-line{background:var(--glass-2);border-color:var(--line)}
.btn-sm{padding:9px 14px;font-size:14px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding:80px 0 100px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted);margin-bottom:22px}
.status i{width:8px;height:8px;border-radius:50%;background:#2FB872}
.hero h1{font-size:clamp(40px,6vw,76px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:0 0 14px}
.hero .role{font-size:clamp(19px,2vw,24px);font-weight:500;margin:0 0 22px;color:var(--cobalt)}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tag{display:inline-block;padding:6px 12px;border-radius:8px;background:var(--cobalt-soft);color:var(--text);font-size:14px;font-weight:500}
.hero p.intro{color:var(--muted);max-width:48ch;margin:0 0 32px;font-size:18px}
.ctas{display:flex;flex-wrap:wrap;gap:10px}

.sample{border-radius:22px;padding:8px}
.sample .pane{padding:22px 24px;border-radius:16px}
.sample .pane + .pane{margin-top:8px;background:var(--glass-2)}
.sample small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.sample p{margin:0;font-size:19px;line-height:1.45;min-height:2.9em;transition:opacity .45s,transform .45s}
.sample p.out{opacity:0;transform:translateY(6px)}
.sample .pane + .pane p{color:var(--cobalt);font-weight:500}
.sample .nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
.sample .nav span{font-size:13px;color:var(--muted)}
.bars{display:flex;gap:4px}
.bars b{width:18px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.bars b.on::after{content:"";position:absolute;inset:0;background:var(--cobalt);animation:fill 5s linear forwards}
@keyframes fill{from{transform:translateX(-100%)}to{transform:none}}

/* sections */
.sec{padding:70px 0}
.sec h2{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.025em;line-height:1.1;margin:0 0 12px;font-weight:700}
.sec .sub{color:var(--muted);max-width:56ch;margin:0 0 36px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

.about{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.about .text{padding:36px;border-radius:22px}
.about .text p{font-size:19px;line-height:1.6;margin:0}
.about ul{list-style:none;margin:0;padding:28px;border-radius:22px;display:grid;gap:4px;align-content:start}
.about li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:500}
.about li:last-child{border-bottom:0}
.about li svg{flex:none;width:20px;height:20px;margin-top:3px;stroke:var(--cobalt);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.svc{padding:28px;border-radius:22px;display:flex;flex-direction:column}
.svc h3{font-size:21px;margin:0 0 8px;letter-spacing:-.01em}
.svc > p{color:var(--muted);margin:0 0 22px}
.rates{margin:auto 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.rates li{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.rates li span:first-child{color:var(--muted)}
.rates li span:last-child{font-weight:600;white-space:nowrap;text-align:right}
.note{margin:22px 0 0;color:var(--muted);font-size:15px}

.work{padding:26px;border-radius:22px;transition:transform .3s}
.work:hover{transform:translateY(-4px)}
.work .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.work .meta .tag{font-size:13px}
.work h3{font-size:19px;margin:0 0 8px}
.work p{margin:0;color:var(--muted);font-size:15px}

.quote{margin:0;padding:30px;border-radius:22px}
.quote blockquote{margin:0 0 18px;font-size:18px;line-height:1.55}
.quote figcaption{font-size:15px;color:var(--muted)}
.quote figcaption b{color:var(--text);font-weight:600}

.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}
.contact .info{padding:32px;border-radius:22px}
.contact .info h2{margin-bottom:12px}
.contact .info p{color:var(--muted);margin:0 0 24px}
.clist{display:grid;gap:2px}
.clist > *{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500}
.clist > *:last-child{border-bottom:0}
.clist svg{width:19px;height:19px;flex:none;stroke:var(--cobalt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
form.req{padding:32px;border-radius:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
form.req .full{grid-column:1/-1}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass-2);outline:none;transition:border-color .2s}
.field select option{color:#15192E}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cobalt)}
.ffoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ffoot small{color:var(--muted)}
.fmsg{color:#D14356;font-weight:500;min-height:1.4em;font-size:15px}

footer{position:relative;z-index:1;padding:36px 0 48px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}

.rv{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}

/* admin */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:none;box-shadow:var(--shadow)}
.fab.show{display:inline-flex}
.dbg{position:fixed;inset:0;z-index:70;background:rgba(10,14,40,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.dbg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:80;width:min(580px,100%);display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.9,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer header{padding:20px 22px 10px;display:flex;justify-content:space-between;align-items:center}
.drawer header h2{margin:0;font-size:19px}
.xbtn{border:1px solid var(--line);background:none;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
.tabs{display:flex;gap:6px;padding:0 22px 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{flex:none;border:1px solid var(--line);background:none;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--cobalt);color:var(--on-cobalt);border-color:transparent}
.dbody{flex:1;overflow-y:auto;padding:16px 22px 24px}
.dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dfoot .st{margin-right:auto;font-size:14px;color:var(--muted)}
.help{color:var(--muted);font-size:14px;margin:0 0 14px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--glass)}
.item .item{background:none;margin-bottom:8px}
.ihead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ihead b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl{display:flex;gap:4px;flex:none}
.ctrl button{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px;font-weight:600}
.ctrl button.del{color:#D14356}
.ef{margin-bottom:10px}
.ef > label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--cobalt);margin-bottom:3px}
.ef input,.ef textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--glass-2);font-size:14px}
.ef textarea{min-height:84px;resize:vertical}
.add{width:100%;border:1.5px dashed var(--line);background:none;padding:10px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px}
.add:hover{border-color:var(--cobalt);color:var(--cobalt)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,30px);opacity:0;padding:11px 18px;border-radius:12px;font-weight:600;transition:all .35s}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:960px){
  .hero{grid-template-columns:1fr;gap:40px;padding-top:40px}
  .g3{grid-template-columns:1fr 1fr}
  .about,.contact{grid-template-columns:1fr}
}
@media (max-width:760px){
  .links{display:none;position:absolute;top:66px;left:0;right:0;flex-direction:column;padding:10px;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow)}
  .links.open{display:flex}
  .menu{display:grid;place-items:center}
  .brand{margin-right:auto}
  .g3,.g2{grid-template-columns:1fr}
  form.req{grid-template-columns:1fr}
  .bi{grid-template-columns:1fr}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>

var sTimer=null, sIdx=0;
function startSamples(){
  clearTimeout(sTimer);
  var list=DATA.samples; if(!list.length) return;
  sIdx=sIdx%list.length;
  var ru=document.getElementById("sRU"), en=document.getElementById("sEN"), bars=document.getElementById("bars");
  function show(first){
    var x=list[sIdx];
    function put(){ ru.textContent=x.ru; en.textContent=x.en; ru.classList.remove("out"); setTimeout(function(){ en.classList.remove("out"); },180); }
    [].forEach.call(bars.children,function(b,i){ b.classList.remove("on"); void b.offsetWidth; if(i===sIdx) b.classList.add("on"); });
    if(first){ put(); } else { ru.classList.add("out"); en.classList.add("out"); setTimeout(put,450); }
    sTimer=setTimeout(function(){ if(!document.getElementById("sRU")) return; sIdx=(sIdx+1)%list.length; show(false); },5000);
  }
  show(true);
}

function field(path,key,type,sub,blank,flatLang,labelKey){
  var p=path?path+"."+key:key, v=getP(p), lab=fl(labelKey||key);
  if(type==="text") return '<div class="ef"><label>'+esc(lab)+'</label><input data-p="'+p+'" value="'+esc(v||"")+'"></div>';
  if(type==="area") return '<div class="ef"><label>'+esc(lab)+'</label><textarea data-p="'+p+'">'+esc(v||"")+'</textarea></div>';
  if(type==="list"){
    var arr=v||[], h='<div class="ef"><label>'+esc(lab)+'</label>';
    arr.forEach(function(it,i){
      h+='<div class="item"><div class="ihead"><b>'+(i+1)+'</b>'+ctrl(p,i)+'</div>';

      else sub.forEach(function(f){ h+=field(p+"."+i,f[0],f[1]); });
      h+='</div>';
    });
    SUBBLANK[p]=blank;
    return h+'<button type="button" class="add" data-act="add" data-l="'+p+'">+ '+t("add")+'</button></div>';

  var p=document.getElementById("dpub"); if(p) p.disabled=!dirty||busy;

  var b=e.target.closest("button"); if(!b) return;
  if(b.id==="dx") return closeD();
  if(b.dataset.tab){ tabId=b.dataset.tab; renderDrawer(); return; }
  if(b.id==="ddisc"){ DATA=JSON.parse(JSON.stringify(ORIGINAL)); changed(); renderDrawer(); return; }
  if(b.id==="dpub"){ publish(); return; }
  var lp=b.dataset.l; if(!lp) return;
  var list=getP(lp); if(!list){ setP(lp,[]); list=getP(lp); }
  var i=+b.dataset.i, a=b.dataset.act;
  if(a==="add") list.push(SUBBLANK[lp]?SUBBLANK[lp]():bi());
  else if(a==="del") list.splice(i,1);
  else if(a==="up"&&i>0) list.splice(i-1,0,list.splice(i,1)[0]);
  else if(a==="down"&&i<list.length-1) list.splice(i+1,0,list.splice(i,1)[0]);

function buildDoc(data){
  var css=document.getElementById("css").textContent, app=document.getElementById("app").textContent;
  var json=JSON.stringify(data).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
    '<title>'+esc(data.site.name)+', Russian–English translator<\/title>\n<meta name="description" content="Russian–English document translation, interpreting and editing by '+esc(data.site.name)+'.">\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">\n'+
    '<style id="css">'+css+'<\/style>\n<\/head>\n<body>\n<script id="site-data" type="application/json">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n<\/body>\n<\/html>\n';
}
function publish(){
  if(!ART||busy||!dirty) return;
  busy=true; document.getElementById("dst").textContent=t("publishing"); document.getElementById("dpub").disabled=true;
  ART.publish(buildDoc(DATA)).then(function(){
    try{sessionStorage.removeItem("site-draft");}catch(e){}
    busy=false; ORIGINAL=JSON.parse(JSON.stringify(DATA)); dirty=false; toast(t("published")); if(drawerOpen) renderDrawer();
  }).catch(function(err){
    busy=false; var c=err&&err.code;
    if(c==="conflict") return;
    if(c==="not_writer"||c==="not_granted"){ CAN_EDIT=false; renderFab(); closeD(); toast(t("readonly")); return; }
    toast(t("failed")); changed();
  });
}

try{ var draft=sessionStorage.getItem("site-draft"); if(draft){ var pd=JSON.parse(draft); if(pd.site&&pd.portfolio&&JSON.stringify(pd)!==JSON.stringify(ORIGINAL)){ DATA=pd; dirty=true; } } }catch(e){}
renderAll();

if(window.claude&&window.claude.use){
  Promise.all([window.claude.use("user"),window.claude.use("artifact")]).then(function(r){
    var user=r[0]; ART=r[1]; if(!user||!ART) return;
    return user.canEdit().then(function(ok){ CAN_EDIT=!!ok; renderFab(); if(CAN_EDIT&&dirty) openD(); });
  }).catch(function(){});
}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Russian–English Translator & Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style id="css">
:root{
  --bg:#E8EEFF; --bg2:#F6F2FF; --text:#141A3A; --muted:rgba(20,26,58,.66);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --edge:rgba(255,255,255,.85); --edge-soft:rgba(20,26,58,.10);
  --neva:#2F8FE0; --amber:#E0922F; --lav:#8C6BE8; --shadow:0 20px 50px -20px rgba(40,50,120,.35);
  --blob1:#9CD4FF; --blob2:#FFD3A1; --blob3:#CBB8FF;
  --radius-lg:28px; --radius-md:18px; --radius-sm:12px;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1433; --bg2:#1A1446; --text:#EEF2FF; --muted:rgba(238,242,255,.68);
    --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --edge:rgba(255,255,255,.20); --edge-soft:rgba(255,255,255,.10);
    --neva:#7CCBFF; --amber:#F2B66D; --lav:#B89CFF; --shadow:0 24px 60px -24px rgba(0,0,0,.7);
    --blob1:#1F5FA8; --blob2:#8A4A1E; --blob3:#4B2FA0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1433; --bg2:#1A1446; --text:#EEF2FF; --muted:rgba(238,242,255,.68);
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --edge:rgba(255,255,255,.20); --edge-soft:rgba(255,255,255,.10);
  --neva:#7CCBFF; --amber:#F2B66D; --lav:#B89CFF; --shadow:0 24px 60px -24px rgba(0,0,0,.7);
  --blob1:#1F5FA8; --blob2:#8A4A1E; --blob3:#4B2FA0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--neva);outline-offset:3px;border-radius:8px}

/* aurora background */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 26s ease-in-out infinite alternate}
.aurora span:nth-child(1){width:52vw;height:52vw;left:-12vw;top:-10vw;background:var(--blob1)}
.aurora span:nth-child(2){width:40vw;height:40vw;right:-8vw;top:18vh;background:var(--blob2);animation-duration:32s;animation-delay:-8s}
.aurora span:nth-child(3){width:46vw;height:46vw;left:24vw;bottom:-20vw;background:var(--blob3);animation-duration:38s;animation-delay:-14s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,8vh) scale(.95)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;background-image:radial-gradient(currentColor 1px,transparent 1px);background-size:3px 3px}

/* glass */
.glass{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:var(--radius-lg);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);box-shadow:var(--shadow), inset 0 1px 0 var(--edge);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 42%);opacity:.6}
.shine::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(360px circle at var(--mx,50%) var(--my,-40%),rgba(255,255,255,.28),transparent 60%);opacity:0;transition:opacity .35s}
.shine:hover::after{opacity:1}

.wrap{position:relative;z-index:1;width:min(1180px,100% - 40px);margin-inline:auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;padding:14px 0}
.bar{display:flex;align-items:center;gap:18px;padding:10px 12px 10px 20px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--neva),var(--lav),var(--amber),var(--neva));color:#fff;font-size:13px;font-weight:800;animation:spin 14s linear infinite}
.brand .mark b{animation:spin 14s linear infinite reverse;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
nav.links{display:flex;gap:4px;margin-left:auto}
nav.links a{text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);transition:background .25s,color .25s}
nav.links a:hover{background:var(--glass-strong);color:var(--text)}
.langswitch{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--edge-soft)}
.langswitch button{position:relative;z-index:1;border:0;background:none;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;border-radius:999px;color:var(--muted);transition:color .3s}
.langswitch button[aria-pressed="true"]{color:#fff}
.langswitch .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(135deg,var(--neva),var(--lav));transition:transform .45s cubic-bezier(.6,-0.2,.2,1.3)}
.langswitch[data-lang="ru"] .pill{transform:translateX(100%)}
.menu-btn{display:none;border:0;background:var(--glass-strong);width:42px;height:42px;border-radius:50%;cursor:pointer}
.menu-btn svg{width:20px;height:20px}

.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:999px;transition:transform .25s, box-shadow .25s, background .25s}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--neva),var(--lav));box-shadow:0 12px 30px -10px var(--lav)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 36px -12px var(--lav)}
.btn-ghost{background:var(--glass-strong);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn-ghost:hover{transform:translateY(-2px)}
.btn-sm{padding:9px 16px;font-size:14px}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:70px 0 90px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.4vw,68px);line-height:1.04;letter-spacing:-.02em;margin:0 0 24px;text-wrap:balance}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:52ch;margin:0 0 34px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}
.availability{display:inline-flex;align-items:center;gap:10px;margin-bottom:26px;padding:8px 16px 8px 12px;border-radius:999px;font-size:14px;font-weight:600}
.availability i{width:9px;height:9px;border-radius:50%;background:#3FD08A;box-shadow:0 0 0 0 rgba(63,208,138,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(63,208,138,0)}100%{box-shadow:0 0 0 0 rgba(63,208,138,0)}}

.lens{aspect-ratio:1/1.05;display:flex;flex-direction:column;justify-content:space-between;padding:30px;border-radius:40px}
.lens .orb{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-18%;top:-16%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),linear-gradient(135deg,var(--neva),var(--lav));opacity:.55;filter:blur(2px);animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translate(-14px,18px)}}
.lens .pair{position:relative;display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--edge-soft);font-size:13px;font-weight:700}
.chip.on{background:linear-gradient(135deg,var(--neva),var(--lav));color:#fff;border-color:transparent}
.morph{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:-.02em;min-height:1.1em;word-break:break-word}
.morph-sub{position:relative;color:var(--muted);font-size:15px;margin-top:10px;min-height:1.5em}
.lens .foot{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--edge-soft);transition:background .3s,width .3s}
.dots i.on{width:22px;border-radius:6px;background:var(--neva)}

/* sections */
section.block{padding:70px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,3.6vw,44px);line-height:1.1;letter-spacing:-.015em;margin:0;max-width:18ch}
.sec-head p{margin:0;color:var(--muted);max-width:44ch}

.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{padding:28px;border-radius:var(--radius-lg);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-6px)}
.icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:22px;background:linear-gradient(135deg,var(--neva),var(--lav));color:#fff;box-shadow:0 10px 24px -10px var(--lav)}
.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.25;margin:0 0 10px}
.card p{margin:0 0 20px;color:var(--muted)}
.price{position:relative;display:inline-block;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--edge-soft);font-size:14px}

/* documents marquee-like cloud */
.docs{padding:34px;border-radius:32px}
.doc-cloud{position:relative;display:flex;flex-wrap:wrap;gap:10px}
.doc-cloud span{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--edge-soft);font-weight:600;transition:transform .3s, background .3s}
.doc-cloud span:hover{transform:translateY(-3px) rotate(-1deg);background:var(--glass)}
.doc-cloud svg{width:16px;height:16px;fill:none;stroke:var(--neva);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.docs-note{position:relative;margin:22px 0 0;color:var(--muted);font-size:15px}

/* courses */
.course{display:flex;flex-direction:column}
.course .meta{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.course .fmt{position:relative;color:var(--muted);font-size:14px;margin:auto 0 18px}
.course .row{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.course.feature{grid-column:span 2;background:linear-gradient(135deg,rgba(124,203,255,.18),rgba(184,156,255,.16)),var(--glass)}

/* about */
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:22px}
.portrait{min-height:360px;border-radius:32px;display:flex;align-items:flex-end;padding:28px}
.portrait .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(90px,14vw,170px);background:linear-gradient(160deg,var(--neva),var(--lav) 55%,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.9}
.portrait .who{position:relative}
.portrait .who strong{display:block;font-family:var(--display);font-size:22px;font-weight:600}
.portrait .who span{color:var(--muted);font-size:15px}
.about-text{padding:34px;border-radius:32px}
.about-text p{position:relative;margin:0 0 24px;font-size:18px;max-width:62ch}
.creds{position:relative;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.creds li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-md);background:var(--glass-strong);border:1px solid var(--edge-soft);font-weight:600}
.creds svg{flex:none;width:20px;height:20px;margin-top:3px;fill:none;stroke:var(--neva);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* testimonials */
.quote{padding:30px}
.quote blockquote{position:relative;margin:0 0 20px;font-size:18px;line-height:1.55}
.quote figcaption{position:relative;color:var(--muted);font-size:15px}
.quote figcaption b{color:var(--text)}

/* contact */
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:22px}
.contact-info{padding:34px;border-radius:32px}
.contact-info h2{position:relative;font-family:var(--display);font-weight:600;font-size:clamp(28px,3.4vw,42px);line-height:1.1;margin:0 0 16px}
.contact-info p{position:relative;color:var(--muted);margin:0 0 26px}
.clist{position:relative;display:grid;gap:10px}
.clist a,.clist div{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-md);background:var(--glass-strong);border:1px solid var(--edge-soft);text-decoration:none;font-weight:600;transition:transform .25s}
.clist a:hover{transform:translateX(4px)}
.clist svg{width:20px;height:20px;fill:none;stroke:var(--neva);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
form.req{padding:34px;border-radius:32px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
form.req .full{grid-column:1/-1}
.field{position:relative;display:grid;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--edge-soft);background:var(--glass-strong);outline:none;transition:border-color .25s, box-shadow .25s}
.field select option{color:#141A3A}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--neva);box-shadow:0 0 0 4px color-mix(in srgb,var(--neva) 22%,transparent)}
.form-foot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.form-foot small{color:var(--muted)}
.form-msg{position:relative;font-weight:600;color:#E0556B;min-height:1.4em}

footer{position:relative;z-index:1;padding:40px 0 50px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* reveal + language swap */
.reveal{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
main.swap{animation:swap .5s ease}
@keyframes swap{0%{opacity:.25;filter:blur(6px)}100%{opacity:1;filter:none}}

/* admin */
.admin-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:none}
.admin-fab.show{display:inline-flex}
.drawer-bg{position:fixed;inset:0;z-index:70;background:rgba(10,14,40,.35);opacity:0;pointer-events:none;transition:opacity .35s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:80;width:min(600px,100%);display:flex;flex-direction:column;border-radius:28px 0 0 28px;background:var(--glass-strong);transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.9,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer header{position:relative;padding:22px 24px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.drawer header h2{margin:0;font-family:var(--display);font-weight:600;font-size:20px}
.drawer .close{border:0;background:var(--glass);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.tabs{position:relative;display:flex;gap:6px;padding:0 24px 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--edge-soft);background:var(--glass);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--neva),var(--lav));color:#fff;border-color:transparent}
.dbody{position:relative;flex:1;overflow-y:auto;padding:4px 24px 24px}
.dfoot{position:relative;padding:16px 24px;border-top:1px solid var(--edge-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dfoot .status{margin-right:auto;font-size:14px;color:var(--muted)}
.ed-help{color:var(--muted);font-size:14px;margin:0 0 16px}
.ed-item{border:1px solid var(--edge-soft);background:var(--glass);border-radius:var(--radius-md);padding:16px;margin-bottom:14px}
.ed-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.ed-item-head b{font-size:14px}
.ed-item-head .ctrl{display:flex;gap:6px}
.ed-item-head .ctrl button{border:1px solid var(--edge-soft);background:var(--glass-strong);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:700}
.ed-item-head .ctrl button.del{color:#E0556B}
.ed-field{margin-bottom:12px}
.ed-field > label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi .tag{font-size:11px;font-weight:800;color:var(--neva);margin-bottom:3px;display:block}
.ed-field input,.ed-field textarea,.ed-field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--edge-soft);background:var(--glass-strong);font-size:14px}
.ed-field select option{color:#141A3A}
.ed-field textarea{min-height:90px;resize:vertical}
.add{width:100%;border:1.5px dashed var(--edge-soft);background:transparent;padding:12px;border-radius:var(--radius-md);cursor:pointer;font-weight:700}
.add:hover{border-color:var(--neva);color:var(--neva)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,40px);opacity:0;padding:12px 20px;border-radius:999px;font-weight:700;transition:all .4s}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;padding-top:40px}
  .lens{aspect-ratio:auto;min-height:320px}
  .g3{grid-template-columns:1fr 1fr}
  .about,.contact{grid-template-columns:1fr}
}
@media (max-width:760px){
  nav.links{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;padding:12px;border-radius:24px;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--edge)}
  nav.links.open{display:flex}
  .menu-btn{display:grid;place-items:center;margin-left:auto}
  .bar .btn-primary{display:none}
  .g3,.g2{grid-template-columns:1fr}
  .course.feature{grid-column:auto}
  form.req{grid-template-columns:1fr}
  .bi{grid-template-columns:1fr}
  .drawer{border-radius:0}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>

/* ---------- morphing word lens ---------- */
var morphTimer=null, morphIdx=0, morphSide=0;
var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var POOL = "абвгдежзийклмнопрстуфхцчшщыэюяabcdefghijklmnopqrstuvwxyz";
function scramble(el,to,done){
  if(RM){ el.textContent=to; done&&done(); return; }
  var from = el.textContent, len=Math.max(from.length,to.length), frame=0, total=26;
  (function step(){
    var out="";
    for(var i=0;i<len;i++){
      var p = frame/total, reveal = i/len;
      if(p>reveal+.25) out += to[i]||"";
      else if(p>reveal-.1) out += POOL[Math.floor(Math.random()*POOL.length)];
      else out += from[i]||"";
    }
    el.textContent = out;
    if(frame++<total) requestAnimationFrame(step); else { el.textContent=to; done&&done(); }
  })();
}
function startMorph(){
  clearInterval(morphTimer);
  var words = DATA.heroWords; if(!words.length) return;
  morphIdx = morphIdx % words.length;
  var el=document.getElementById("morph"), sub=document.getElementById("morphSub"), dots=document.getElementById("dots");
  dots.innerHTML = words.map(function(){return "<i></i>";}).join("");
  function show(){
    var w = words[morphIdx], word = morphSide===0 ? w.ru : w.en, other = morphSide===0 ? w.en : w.ru;
    document.getElementById("chipRU").classList.toggle("on",morphSide===0);
    document.getElementById("chipEN").classList.toggle("on",morphSide===1);
    [].forEach.call(dots.children,function(d,i){ d.classList.toggle("on",i===morphIdx); });
    scramble(el,word);
    sub.textContent = (morphSide===0?"→ ":"← ")+other;
  }
  el.textContent = words[morphIdx].ru; show();
  morphTimer = setInterval(function(){
    if(!document.getElementById("morph")){ clearInterval(morphTimer); return; }
    if(morphSide===0){ morphSide=1; } else { morphSide=0; morphIdx=(morphIdx+1)%words.length; }
    show();
  }, 2400);
}

/* ---------- admin editor ---------- */
var ART=null, CAN_EDIT=false, drawerOpen=false, activeTab="general", dirty=false, busy=false;
var F = { // field labels
  name:{en:"Name",ru:"Имя"},initials:{en:"Initials (logo)",ru:"Инициалы (логотип)"},role:{en:"Role",ru:"Должность"},availability:{en:"Availability badge",ru:"Статус доступности"},
  heroTitle:{en:"Headline",ru:"Заголовок"},heroText:{en:"Intro text",ru:"Вступительный текст"},email:{en:"Email",ru:"Email"},phone:{en:"Phone",ru:"Телефон"},telegram:{en:"Telegram",ru:"Telegram"},location:{en:"Location",ru:"Местоположение"},
  ru:{en:"Russian word",ru:"Русское слово"},en:{en:"English word",ru:"Английское слово"},icon:{en:"Icon",ru:"Иконка"},title:{en:"Title",ru:"Название"},text:{en:"Text",ru:"Текст"},price:{en:"Price",ru:"Цена"},
  level:{en:"Level",ru:"Уровень"},format:{en:"Format",ru:"Формат"},feature:{en:"Highlight as most requested",ru:"Выделить как популярное"},quote:{en:"Quote",ru:"Отзыв"},author:{en:"Author",ru:"Автор"},
  documentsNote:{en:"Note under the list",ru:"Примечание под списком"},aboutText:{en:"About text",ru:"Текст о себе"}
};
function fl(k){ return (F[k]&&F[k][LANG])||k; }
var TABS = [
  {id:"general",label:"tGeneral",help:"helpGeneral",kind:"obj",path:"site",fields:[["name","text"],["initials","text"],["role","bi"],["availability","bi"],["heroTitle","bi"],["heroText","bia"],["location","bi"],["email","text"],["phone","text"],["telegram","text"]]},
  {id:"hero",label:"tHero",help:"helpHero",kind:"list",path:"heroWords",fields:[["ru","text"],["en","text"]],blank:{ru:"",en:""}},
  {id:"services",label:"tServices",help:"helpList",kind:"list",path:"services",fields:[["icon","icon"],["title","bi"],["text","bia"],["price","bi"]],blank:{icon:"globe",title:{en:"",ru:""},text:{en:"",ru:""},price:{en:"",ru:""}}},
  {id:"docs",label:"tDocs",help:"helpList",kind:"list",path:"documents",fields:[["name","bi"]],blank:{name:{en:"",ru:""}},extra:[["documentsNote","bia"]]},
  {id:"courses",label:"tCourses",help:"helpList",kind:"list",path:"courses",fields:[["feature","bool"],["title","bi"],["level","bi"],["text","bia"],["format","bi"],["price","bi"]],blank:{feature:false,title:{en:"",ru:""},level:{en:"",ru:""},text:{en:"",ru:""},format:{en:"",ru:""},price:{en:"",ru:""}}},
  {id:"about",label:"tAbout",help:"helpList",kind:"list",path:"credentials",fields:[["text","bi"]],blank:{text:{en:"",ru:""}},extraAbout:true},
  {id:"reviews",label:"tReviews",help:"helpList",kind:"list",path:"testimonials",fields:[["quote","bia"],["author","text"],["role","bi"]],blank:{quote:{en:"",ru:""},author:"",role:{en:"",ru:""}}}
];
function getP(path){ return path.split(".").reduce(function(o,k){ return o==null?o:o[k]; },DATA); }
function setP(path,val){ var ks=path.split("."), o=DATA; for(var i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=val; }
function fieldHTML(base,key,type){
  var p = base ? base+"."+key : key, v = getP(p);
  var lab = key==="text"&&base==="about"?fl("aboutText"):fl(key);
  if(type==="text") return '<div class="ed-field"><label>'+esc(lab)+'</label><input data-p="'+p+'" value="'+esc(v||"")+'"></div>';
  if(type==="bool") return '<div class="ed-field"><label><input type="checkbox" data-p="'+p+'" data-bool="1" '+(v?"checked":"")+' style="width:auto;margin-right:8px">'+esc(lab)+'</label></div>';
  if(type==="icon") return '<div class="ed-field"><label>'+esc(lab)+'</label><select data-p="'+p+'">'+Object.keys(ICONS).map(function(k){return '<option'+(k===v?' selected':'')+'>'+k+'</option>';}).join("")+'</select></div>';
  var area = type==="bia"; v = v||{};
  function inp(l){ return area ? '<textarea data-p="'+p+"."+l+'">'+esc(v[l]||"")+'</textarea>' : '<input data-p="'+p+"."+l+'" value="'+esc(v[l]||"")+'">'; }
  return '<div class="ed-field"><label>'+esc(lab)+'</label><div class="bi"><div><span class="tag">EN</span>'+inp("en")+'</div><div><span class="tag">RU</span>'+inp("ru")+'</div></div></div>';
}
function renderDrawer(){
  var dr = document.getElementById("drawer");
  var tab = TABS.filter(function(x){return x.id===activeTab;})[0];
  var body = '<p class="ed-help">'+t(tab.help)+'</p>';
  if(tab.kind==="obj"){
    tab.fields.forEach(function(f){ body += fieldHTML(tab.path,f[0],f[1]); });
    body += '<p class="ed-help" style="margin-top:18px">'+t("loginNote")+'</p>';
  } else {
    if(tab.extraAbout) body += '<div class="ed-item">'+fieldHTML("about","text","bia")+'</div>';
    if(tab.extra) tab.extra.forEach(function(f){ body += '<div class="ed-item">'+fieldHTML("",f[0],f[1])+'</div>'; });
    var list = getP(tab.path)||[];
    list.forEach(function(item,i){
      var title = item.title?L(item.title):item.name?L(item.name):item.ru?(item.ru+" / "+item.en):item.author?item.author:item.text?L(item.text):"";
      body += '<div class="ed-item"><div class="ed-item-head"><b>'+(i+1)+'. '+esc(title||"—")+'</b><div class="ctrl">'+
        '<button type="button" data-act="up" data-i="'+i+'" aria-label="Move up">↑</button><button type="button" data-act="down" data-i="'+i+'" aria-label="Move down">↓</button>'+
        '<button type="button" class="del" data-act="del" data-i="'+i+'">'+t("remove")+'</button></div></div>';
      tab.fields.forEach(function(f){ body += fieldHTML(tab.path+"."+i,f[0],f[1]); });
      body += '</div>';
    });
    body += '<button type="button" class="add" data-act="add">+ '+t("addItem")+'</button>';
  }
  dr.innerHTML = '<header><h2>'+t("editorTitle")+'</h2><button class="close" type="button" id="dclose" aria-label="Close">×</button></header>'+
    '<div class="tabs" role="tablist">'+TABS.map(function(x){return '<button type="button" role="tab" data-tab="'+x.id+'" aria-selected="'+(x.id===activeTab)+'">'+t(x.label)+'</button>';}).join("")+'</div>'+
    '<div class="dbody" id="dbody">'+body+'</div>'+
    '<div class="dfoot"><span class="status" id="dstatus">'+(dirty?t("unsaved"):t("nochanges"))+'</span><button class="btn btn-ghost btn-sm" type="button" id="ddiscard" '+(dirty?'':'disabled')+'>'+t("discard")+'</button><button class="btn btn-primary btn-sm" type="button" id="dpublish" '+(dirty&&!busy?'':'disabled')+'>'+t("publish")+'</button></div>';
}
var reTimer=null;
function markDirty(){
  dirty = JSON.stringify(DATA)!==JSON.stringify(ORIGINAL);
  var st=document.getElementById("dstatus"); if(st) st.textContent = dirty?t("unsaved"):t("nochanges");
  var pb=document.getElementById("dpublish"); if(pb) pb.disabled=!dirty||busy;
  var db=document.getElementById("ddiscard"); if(db) db.disabled=!dirty;
  try{ if(dirty) sessionStorage.setItem("site-draft",JSON.stringify(DATA)); else sessionStorage.removeItem("site-draft"); }catch(e){}
  clearTimeout(reTimer); reTimer=setTimeout(function(){ renderBar(); renderMain(); document.querySelectorAll(".reveal").forEach(function(el){el.classList.add("in");}); },250);
}
function openDrawer(){ drawerOpen=true; renderDrawer(); document.getElementById("drawer").classList.add("open"); document.getElementById("drawer").setAttribute("aria-hidden","false"); document.getElementById("dbg").classList.add("open"); }
function closeDrawer(){ drawerOpen=false; document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer").setAttribute("aria-hidden","true"); document.getElementById("dbg").classList.remove("open"); }
function renderFab(){ var f=document.getElementById("fab"); f.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'+t("edit"); f.classList.toggle("show",CAN_EDIT); }
function toast(msg){ var el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove("show");},2600); }

document.getElementById("fab").addEventListener("click",openDrawer);
document.getElementById("dbg").addEventListener("click",closeDrawer);
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&drawerOpen) closeDrawer(); });
var drawer = document.getElementById("drawer");
drawer.addEventListener("input",function(e){
  var p=e.target.getAttribute("data-p"); if(!p) return;
  setP(p, e.target.getAttribute("data-bool")?e.target.checked:e.target.value); markDirty();
});
drawer.addEventListener("change",function(e){ if(e.target.getAttribute("data-bool")||e.target.tagName==="SELECT"){ var p=e.target.getAttribute("data-p"); if(p){ setP(p, e.target.getAttribute("data-bool")?e.target.checked:e.target.value); markDirty(); } } });
drawer.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.id==="dclose") return closeDrawer();
  if(b.dataset.tab){ activeTab=b.dataset.tab; renderDrawer(); return; }
  if(b.id==="ddiscard"){ DATA=JSON.parse(JSON.stringify(ORIGINAL)); markDirty(); renderDrawer(); return; }
  if(b.id==="dpublish"){ publish(); return; }
  var tab = TABS.filter(function(x){return x.id===activeTab;})[0], list=getP(tab.path), i=+b.dataset.i;
  if(b.dataset.act==="add"){ list.push(JSON.parse(JSON.stringify(tab.blank))); }
  else if(b.dataset.act==="del"){ list.splice(i,1); }
  else if(b.dataset.act==="up"&&i>0){ list.splice(i-1,0,list.splice(i,1)[0]); }
  else if(b.dataset.act==="down"&&i<list.length-1){ list.splice(i+1,0,list.splice(i,1)[0]); }
  else return;
  markDirty(); var sc=document.getElementById("dbody").scrollTop; renderDrawer(); document.getElementById("dbody").scrollTop = b.dataset.act==="add"?1e6:sc;
});

var HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Russian–English Translator & Tutor<\/title>\n'+
  '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
  '<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">\n';
function buildDoc(data){
  var css = document.getElementById("css").textContent;
  var app = document.getElementById("app").textContent;
  var json = JSON.stringify(data).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+HEAD+'<style id="css">'+css+'<\/style>\n<\/head>\n<body>\n<script id="site-data" type="application/json">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n<\/body>\n<\/html>\n';
}
function publish(){
  if(!ART||busy||!dirty) return;
  busy=true; var st=document.getElementById("dstatus"); if(st) st.textContent=t("publishing"); document.getElementById("dpublish").disabled=true;
  var title = DATA.site.name;
  ART.publish(buildDoc(DATA)).then(function(){
    try{sessionStorage.removeItem("site-draft");}catch(e){}
    busy=false; ORIGINAL=JSON.parse(JSON.stringify(DATA)); dirty=false; toast(t("published")); if(drawerOpen) renderDrawer();
  }).catch(function(err){
    busy=false; var code = err&&err.code;
    if(code==="conflict") return; // page reloads to the newest version
    if(code==="not_writer"||code==="not_granted"){ CAN_EDIT=false; renderFab(); closeDrawer(); toast(t("readonly")); return; }
    toast(t("failed")); markDirty();
  });
}

/* restore an unsent draft after a reload */
try{ var dr=sessionStorage.getItem("site-draft"); if(dr){ var parsed=JSON.parse(dr); if(JSON.stringify(parsed)!==JSON.stringify(ORIGINAL)){ DATA=parsed; dirty=true; } } }catch(e){}

renderAll();

if(window.claude && window.claude.use){
  Promise.all([window.claude.use("user"), window.claude.use("artifact")]).then(function(r){
    var user=r[0]; ART=r[1];
    if(!user||!ART) return;
    return user.canEdit().then(function(ok){ CAN_EDIT=!!ok; renderFab(); if(CAN_EDIT&&dirty) openDrawer(); });
  }).catch(function(){});
}
})();
